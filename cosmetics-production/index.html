<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmetics Ingredients - База компонентов для косметики</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            min-height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, #6fb600 0%, #4a8f00 100%);
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        
        header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
        
        /* Скрываем скроллбар для container с карточками */
        #ingredients-container::-webkit-scrollbar {
            display: none;
        }
        
        @media (max-width: 768px) {
            main {
                padding: 20px;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .nav-btn.prev {
                left: -10px !important;
            }
            
            .nav-btn.next {
                right: -10px !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🧪 Cosmetics Ingredients</h1>
        <p>База знаний о компонентах для производства косметики</p>
    </header>
    
    <main id="app">
        <div style="text-align: center; padding: 50px;">
            <div class="loader">Загрузка...</div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2024 Cosmetics Ingredients - База компонентов для производства косметики</p>
    </footer>
    
    <script type="module">
        import { MainPage } from './pages/main/index.js';
        
        const app = document.getElementById('app');
        const mainPage = new MainPage(app);
        mainPage.render();
    </script>
</body>
</html>
