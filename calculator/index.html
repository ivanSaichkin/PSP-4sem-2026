<!DOCTYPE html>
<html>
    <head>
        <title>Калькулятор</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <!-- Хедер -->
        <header class="site-header">
            <nav>
                <button class="icon-btn" onclick="window.location.href='index.html'">
                    <img src="images/home_background.png" alt="Главная" class="nav-icon">
                </button>

                <a href="contacts.html">Контакты</a>
            </nav>
        </header>

        <!-- Основной контент -->
        <main class="content">
            <div class="calculator">
                <div id="result" class="result">
                    0
                </div>

                <div class="dial">
                    <div>  
                        <button id="btn_op_clear" class="my-btn secondary">C</button>
                        <button id="btn_op_sign" class="my-btn secondary">+/-</button>
                        <button id="btn_op_percent" class="my-btn secondary">%</button>
                        <button id="btn_op_div" class="my-btn primary">/</button>
                    </div>
                    <div>
                        <button id="btn_digit_7" class="my-btn numbers">7</button>
                        <button id="btn_digit_8" class="my-btn numbers">8</button>
                        <button id="btn_digit_9" class="my-btn numbers">9</button>
                        <button id="btn_op_mult" class="my-btn primary">x</button>
                    </div>
                    <div>
                        <button id="btn_digit_4" class="my-btn numbers">4</button>
                        <button id="btn_digit_5" class="my-btn numbers">5</button>
                        <button id="btn_digit_6" class="my-btn numbers">6</button>
                        <button id="btn_op_minus" class="my-btn primary">-</button>
                    </div>
                    <div>
                        <button id="btn_digit_1" class="my-btn numbers">1</button>
                        <button id="btn_digit_2" class="my-btn numbers">2</button>
                        <button id="btn_digit_3" class="my-btn numbers">3</button>
                        <button id="btn_op_plus" class="my-btn primary">+</button>
                    </div>
                    <div>
                        <button id="btn_digit_0" class="my-btn numbers">0</button>
                        <button id="btn_digit_dot" class="my-btn numbers">.</button>
                        <button id="btn_op_equal" class="my-btn primary execute">=</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Футер -->
        <footer class="site-footer">
            <p>© 2026 Калькулятор. Все права защищены.</p>
        </footer>
    </body>
</html>
